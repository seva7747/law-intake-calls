<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intake Calls</title>
<style>
  :root { --bg:#f6f4ef; --card:#fff; --ink:#1d2433; --muted:#667085; --line:#e4e0d6; --accent:#1f3a5f; --red:#b42318; --redbg:#fef3f2; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14171d; --card:#1c2029; --ink:#e8eaf0; --muted:#98a2b3; --line:#2b303c; --accent:#8fb4e8; --red:#fda29b; --redbg:#3a1c1a; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 Georgia, "Times New Roman", serif; }
  header { padding:24px 16px 8px; max-width:1000px; margin:0 auto; }
  h1 { margin:0; font-size:26px; color:var(--accent); }
  header p { margin:4px 0 0; color:var(--muted); font-family:system-ui,sans-serif; font-size:14px; }
  main { max-width:1000px; margin:0 auto; padding:8px 16px 48px; display:grid; gap:12px; }
  .toolbar { display:flex; gap:8px; font-family:system-ui,sans-serif; }
  input[type=search] { flex:1; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--ink); font-size:15px; }
  button { padding:10px 14px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--ink); cursor:pointer; font-size:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .card.urgent { border-color:var(--red); }
  .top { display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .name { font-size:19px; font-weight:bold; }
  .meta { font-family:system-ui,sans-serif; font-size:13px; color:var(--muted); }
  .badge { font-family:system-ui,sans-serif; font-size:12px; font-weight:600; padding:2px 8px; border-radius:99px; background:var(--redbg); color:var(--red); }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:6px 16px; margin:12px 0; font-family:system-ui,sans-serif; font-size:14px; }
  .grid b { color:var(--muted); font-weight:500; display:block; font-size:12px; }
  h4 { margin:14px 0 4px; font-family:system-ui,sans-serif; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
  ul { margin:0; padding-left:20px; }
  details { margin-top:12px; font-family:system-ui,sans-serif; font-size:14px; }
  pre { white-space:pre-wrap; font:13px/1.5 system-ui,sans-serif; background:var(--bg); padding:12px; border-radius:8px; }
  .empty { text-align:center; color:var(--muted); padding:48px 0; font-family:system-ui,sans-serif; }
</style>
</head>
<body>
<header>
  <h1>Intake Calls</h1>
  <p id="count">Loading…</p>
</header>
<main>
  <div class="toolbar">
    <input type="search" id="q" placeholder="Search name, address, phone, anything…">
    <button id="refresh">Refresh</button>
  </div>
  <div id="list"></div>
</main>
<script>
let data = [];
const $ = (id) => document.getElementById(id);
const h = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const li = (a) => (a && a.length ? "<ul>" + a.map((x) => `<li>${h(x)}</li>`).join("") + "</ul>" : "<span class='meta'>None</span>");

function render() {
  const q = $("q").value.toLowerCase();
  const rows = data.filter((r) => !q || JSON.stringify(r).toLowerCase().includes(q));
  $("count").textContent = `${rows.length} call${rows.length === 1 ? "" : "s"}`;
  if (!rows.length) { $("list").innerHTML = "<div class='empty'>No calls yet.</div>"; return; }
  $("list").innerHTML = rows.map((r) => {
    const s = r.summary || {};
    return `<article class="card ${s.urgent ? "urgent" : ""}">
      <div class="top">
        <div><div class="name">${h(s.caller_name || "Unknown caller")} ${s.urgent ? '<span class="badge">URGENT</span>' : ""}</div>
        <div class="meta">${new Date(r.startedAt).toLocaleString()} · Caller ID ${h(r.from || "?")}</div></div>
        <div class="meta">${h(s.matter_type || "")}</div>
      </div>
      <div class="grid">
        <div><b>Callback number</b>${h(s.callback_number || "—")}</div>
        <div><b>Email</b>${h(s.caller_email || "—")}</div>
        <div><b>Property</b>${h(s.property_address || "—")}</div>
        <div><b>Other party</b>${h(s.other_party || "—")}</div>
      </div>
      ${s.urgent ? `<p><b>Urgent:</b> ${h(s.urgency_reason || "")}</p>` : ""}
      <h4>Summary</h4><p>${h(s.summary || "")}</p>
      <h4>Key facts</h4>${li(s.key_facts)}
      <h4>Desired outcome</h4><p>${h(s.desired_outcome || "—")}</p>
      <h4>Still to ask</h4>${li(s.follow_up_questions)}
      <details><summary>Full transcript</summary><pre>${h(r.transcript)}</pre></details>
    </article>`;
  }).join("");
}
async function load() {
  const r = await fetch("/api/intakes");
  data = await r.json();
  render();
}
$("q").addEventListener("input", render);
$("refresh").addEventListener("click", load);
load();
</script>
</body>
</html>
